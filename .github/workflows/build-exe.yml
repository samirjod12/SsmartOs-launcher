name: Build SmartOS.exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller python-vlc
      - name: Build exe
        run: pyinstaller --onefile --noconsole --name SmartOS smartos.py
      - uses: actions/upload-artifact@v4
        with:
          name: SmartOS-windows
          path: dist/SmartOS.exe
      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/SmartOS.exe

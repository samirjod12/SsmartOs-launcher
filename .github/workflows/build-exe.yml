name: Build SmartOS for Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build (folder build, most reliable with QtWebEngine)
        run: pyinstaller --noconfirm --windowed --name SmartOS smartos.py
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/SmartOS -DestinationPath SmartOS-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SmartOS-windows
          path: SmartOS-windows.zip
      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SmartOS-windows.zip
